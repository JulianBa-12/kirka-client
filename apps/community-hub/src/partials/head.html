<!doctype html>
<html lang="en" data-page="{{id}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="{{csp}}">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  {{base}}
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#07090F">
  <meta name="color-scheme" content="dark">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/brand/icon-client.png">
  <link rel="preload" href="assets/fonts/satoshi-900.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/satoshi-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{baseCss}}">
  <link rel="stylesheet" href="{{siteCss}}">
  {{pageCss}}
  <script defer src="{{iconsJs}}"></script>
  <script defer src="{{markdownJs}}"></script>
  {{pageJs}}
</head>
<body{{bodyClass}}>
