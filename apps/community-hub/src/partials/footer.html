<footer class="site-footer" data-chrome="footer">
  <div class="wrap">
    <div class="site-footer__top">
      <div class="site-footer__brand">
        <a class="brand brand--footer" href="index.html">{{mark}}<span class="brand__name" data-chrome="site-name">{{siteName}}</span></a>
        <p class="site-footer__tagline" data-chrome="tagline">{{tagline}}</p>
      </div>
      <div class="site-footer__cols" data-chrome="footer-cols">
      {{footerCols}}
      </div>
    </div>
    <div class="site-footer__legal">
      <p class="site-footer__disclaimer" data-chrome="footer-note">{{footerNote}}</p>
      <p class="site-footer__meta pl-mono"><a href="{{githubUrl}}" data-chrome="github" rel="noopener">Source on GitHub</a><span aria-hidden="true"> / </span><a href="about.html">About</a><span aria-hidden="true"> / </span><span data-chrome="data-status">Static mirror</span></p>
    </div>
  </div>
</footer>
<noscript><div class="noscript">Interactive sections of this site need JavaScript. Navigation, downloads and documentation links still work.</div></noscript>
</body>
</html>
