<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header" data-chrome="header">
  <div class="wrap site-header__inner">
    <a class="brand" href="index.html" data-chrome="brand">
      {{mark}}
      <span class="brand__name" data-chrome="site-name">{{siteName}}</span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <span class="nav-toggle__bars" aria-hidden="true"></span>
      <span class="nav-toggle__label">Menu</span>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="Main">
      <ul class="site-nav__list" data-chrome="nav">
          {{nav}}
      </ul>
      <div class="site-nav__aux">
        <a class="site-nav__account" href="community.html#account" data-chrome="account">Sign in</a>
        <a class="btn btn--primary btn--sm pl-chamfer" href="downloads.html">Download</a>
      </div>
    </nav>
  </div>
</header>
<div class="announcements" data-chrome="announcements" aria-live="polite"></div>
