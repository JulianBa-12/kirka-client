name: Bug report
description: Something in Polaris Client does not work as expected.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Polaris version
      description: Shown in Settings → About and in the status bar.
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Linux distribution and desktop
      placeholder: Ubuntu 24.04, GNOME, Wayland
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      description: Settings → Advanced → Open log folder (~/.config/Polaris Client/logs). Remove anything private.
      render: text
